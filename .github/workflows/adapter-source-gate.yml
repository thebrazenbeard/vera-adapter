name: Vera Adapter source gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test model-neutral invocation and provenance boundaries
        run: python -m unittest discover -s tests -v
